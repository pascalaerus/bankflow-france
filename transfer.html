<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b132b"><title>Nouveau virement — BankFlow</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="transfer">
  <main id="appView" class="app-shell"><header class="topbar"><a class="brand brand-link" href="dashboard.html"><div class="brand-mark small-mark" aria-hidden="true"><span>B</span><i></i></div><div><strong>BANK<span>FLOW</span></strong><small>FRANCE</small></div></a><div class="topbar-right"><span class="demo-chip">VOTRE ESPACE</span><span id="userEmail" class="user-email"></span><button id="logoutBtn" class="ghost-btn">Déconnexion ↗</button></div></header>
  <div class="dashboard"><nav class="page-nav" aria-label="Navigation de l’espace"><a href="dashboard.html">Vue d’ensemble</a><a class="active" href="transfer.html">Nouveau virement</a><a href="history.html">Historique</a></nav><section class="page-heading"><div><p class="eyebrow">OPÉRATION</p><h1>Nouveau virement</h1><p class="muted">Les informations restent dans ce navigateur.</p></div><span class="panel-icon">↗</span></section>
